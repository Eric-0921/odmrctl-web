[package]
name = "recipe-two-device-run"
version = "0.1.0"
edition = "2021"
description = "M3.4 recipe-shaped SMB100A/OE1022D two-device run with harness, replay, and real modes"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
serialport = "4"

odmr-smb100a = { path = "../../../crates/odmr-smb100a" }
odmr-oe1022d = { path = "../../../crates/odmr-oe1022d" }
odmr-logging = { path = "../../../crates/odmr-logging" }
odmr-device = { path = "../../../crates/odmr-device" }
odmr-types = { path = "../../../crates/odmr-types" }
odmr-recipe = { path = "../../../crates/odmr-recipe" }
odmr-compiler = { path = "../../../crates/odmr-compiler" }
odmr-safety = { path = "../../../crates/odmr-safety" }

[dev-dependencies]
tempfile = "3"

[workspace]
