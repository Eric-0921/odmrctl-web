[package]
name = "maynuo-m8812-recur-microtest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Mag-M3 single-axis recurrent current / field micro-test for Maynuo M8812"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
odmr-device = { path = "../../../crates/odmr-device" }
odmr-mag = { path = "../../../crates/odmr-mag" }
odmr-maynuo-m8812 = { path = "../../../crates/odmr-maynuo-m8812" }
odmr-types = { path = "../../../crates/odmr-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[workspace]
