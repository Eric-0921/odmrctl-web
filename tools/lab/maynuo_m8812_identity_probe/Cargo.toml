[package]
name = "maynuo-m8812-identity-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Identity-only Maynuo M8812 discovery — enumerates serial ports, sends *IDN?, maps SN to logical axes"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
odmr-device = { path = "../../../crates/odmr-device" }
odmr-mag = { path = "../../../crates/odmr-mag" }
odmr-maynuo-m8812 = { path = "../../../crates/odmr-maynuo-m8812" }
odmr-types = { path = "../../../crates/odmr-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[workspace]
