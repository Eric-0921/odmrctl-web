[package]
name = "rf-mag-oe-minimal-run"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Mag-M5A: minimal RF + single-axis magnetic + OE combined run tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

odmr-types = { path = "../../../crates/odmr-types" }
odmr-logging = { path = "../../../crates/odmr-logging" }
odmr-mag = { path = "../../../crates/odmr-mag" }
odmr-maynuo-m8812 = { path = "../../../crates/odmr-maynuo-m8812" }
odmr-oe1022d = { path = "../../../crates/odmr-oe1022d" }

[dev-dependencies]
tempfile = "3"

[workspace]
