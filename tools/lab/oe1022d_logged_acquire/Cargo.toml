[package]
name = "oe1022d-logged-acquire"
version = "0.1.0"
edition = "2021"
description = "OE1022D bounded acquisition with formal odmr-logging run artifacts (M2.6)."
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serialport = "4"
odmr-oe1022d = { path = "../../../crates/odmr-oe1022d" }
odmr-logging = { path = "../../../crates/odmr-logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone binary — not part of the parent Cargo workspace.
[workspace]

[dev-dependencies]
tempfile = "3"
