[package]
name = "oe1022d-buffer-probe"
version = "0.1.0"
edition = "2021"
description = "Narrow OE1022D buffer-sampling probe for real-hardware 1 kHz validation."
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
odmr-oe1022d = { path = "../../../crates/odmr-oe1022d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[workspace]
