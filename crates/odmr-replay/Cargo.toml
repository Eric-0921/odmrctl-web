[package]
name = "odmr-replay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Canonical replay and legacy rawbin migration for ODMR run artifacts."

[dependencies]
odmr-oe1022d = { path = "../odmr-oe1022d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
