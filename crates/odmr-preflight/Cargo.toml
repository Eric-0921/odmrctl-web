[package]
name = "odmr-preflight"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified station preflight: device discovery, identity probe, safe-state verification, device locks, and station ledger."

[dependencies]
odmr-config = { path = "../odmr-config" }
odmr-types = { path = "../odmr-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.9"
chrono = "0.4"
fs2 = "0.4"
odmr-laser = { path = "../odmr-laser" }
