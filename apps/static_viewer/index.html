<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OE1022D Dataset Viewer — Live</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1f2328; font-size: 13px; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
  .topbar h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .badge.good { background: #dafbe1; color: #1a7f37; }
  .badge.info { background: #ddf4ff; color: #0969da; }
  .badge.warn { background: #fff8c5; color: #9a6700; }
  .badge.bad  { background: #ffebe9; color: #cf222e; }
  .main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 80px); gap: 1px; background: #d0d7de; }
  .sidebar { background: #fff; padding: 12px; overflow-y: auto; }
  .chart { background: #fff; padding: 12px; }
  .label { display: block; font-size: 11px; color: #656d76; margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .metric { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .metric .v { font-weight: 600; font-family: ui-monospace, monospace; }
  .file-list { max-height: 200px; overflow-y: auto; border: 1px solid #d0d7de; border-radius: 3px; background: #fff; }
  .file-list .item { padding: 4px 8px; font-family: ui-monospace, monospace; font-size: 11px; cursor: pointer; border-bottom: 1px solid #f5f7fa; }
  .file-list .item:hover { background: #f6f8fa; }
  .file-list .item.selected { background: #ddf4ff; color: #0969da; font-weight: 600; }
  .statusbar { padding: 6px 16px; background: #fff; border-top: 1px solid #d0d7de; font-size: 11px; color: #656d76; }
  .playbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .playbar button { padding: 4px 10px; border: 1px solid #d0d7de; background: #fff; border-radius: 3px; cursor: pointer; font-size: 12px; }
  .playbar button:hover { background: #f6f8fa; }
  .playbar button.primary { background: #0969da; color: #fff; border-color: #0969da; }
  .playbar input[type=range] { flex: 1; }
  .playbar .spd { font-family: ui-monospace, monospace; font-size: 11px; color: #656d76; min-width: 60px; }
  .fps-readout { font-family: ui-monospace, monospace; font-size: 11px; color: #656d76; }
</style>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="topbar">
  <h1>OE1022D Dataset Viewer — Live SSE</h1>
  <span class="badge info" id="status-badge">Idle</span>
  <span id="file-path" style="color: #656d76; font-family: ui-monospace, monospace; font-size: 12px;"></span>
  <span class="fps-readout" id="fps-readout">— fps</span>
</div>
<div class="main">
  <div class="sidebar">
    <span class="label">Run files (./runs/*/samples.ndjson)</span>
    <div class="file-list" id="file-list">
      <div class="item" style="color: #656d76; cursor: default;">loading...</div>
    </div>
    <span class="label">Stream status</span>
    <div class="metric"><span>Run</span><span class="v" id="m_run">—</span></div>
    <div class="metric"><span>next_idx</span><span class="v" id="m_idx">—</span></div>
    <div class="metric"><span>Speed</span><span class="v" id="m_speed">— x</span></div>
    <div class="metric"><span>Emit interval</span><span class="v" id="m_emit">— ms</span></div>
    <div class="metric"><span>Window</span><span class="v" id="m_window">—</span></div>
    <div class="metric"><span>Backend FPS</span><span class="v" id="m_fps">—</span></div>
    <span class="label">Controls</span>
    <div class="playbar">
      <button class="primary" id="btn-start">▶ Start</button>
      <button id="btn-stop">⏹ Stop</button>
      <input type="range" id="speed" min="1" max="600" step="1" value="60" />
      <span class="spd"><span id="spd-val">60</span>x</span>
    </div>
    <div class="playbar">
      <span class="spd" style="min-width: auto;">Visible window:</span>
      <input type="range" id="window" min="100" max="5000" step="100" value="1000" />
      <span class="spd" id="win-val">1000</span>
    </div>
    <div class="playbar">
      <span class="spd" style="min-width: auto;">Emit interval:</span>
      <input type="range" id="emit_ms" min="8" max="200" step="1" value="16" />
      <span class="spd"><span id="emit-val">16</span> ms (~<span id="emit-hz">60</span> Hz)</span>
    </div>
  </div>
  <div class="chart" id="chart"></div>
</div>
<div class="statusbar" id="statusbar">Ready</div>

<script>
const COLOR = {
  BX: '#0969da',
  BY: '#1a7f37',
  BFreq: '#9a6700',
};
const FIELD_NAME = { BX: 'B-X (V)', BY: 'B-Y (V)', BFreq: 'B-Freq (Hz)' };

let evtSource = null;
let emitTickHistory = []; // for FPS readout
let latestByField = { BX: [], BY: [], BFreq: [] };
let lastRenderMs = 0;
let currentRunId = null;

async function loadFileList() {
  const list = document.getElementById('file-list');
  try {
    const r = await fetch('/api/runs');
    const runs = await r.json();
    list.innerHTML = '';
    if (runs.length === 0) {
      list.innerHTML = '<div class="item" style="color: #656d76; cursor: default;">no runs found</div>';
      return;
    }
    for (const run of runs) {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = `${run.run_id}  (${run.size_mb.toFixed(1)} MB)`;
      item.onclick = () => selectRun(run.run_id);
      list.appendChild(item);
    }
  } catch (e) {
    list.innerHTML = `<div class="item" style="color: #cf222e; cursor: default;">error: ${e}</div>`;
  }
}

function selectRun(runId) {
  currentRunId = runId;
  document.querySelectorAll('.file-list .item').forEach(el => {
    el.classList.toggle('selected', el.textContent.startsWith(runId));
  });
  document.getElementById('file-path').textContent = '/runs/' + runId + '/samples.ndjson';
  // Auto-start streaming.
  startStream();
}

function setStatus(msg, kind = 'info') {
  document.getElementById('statusbar').textContent = msg;
  const badge = document.getElementById('status-badge');
  badge.textContent = kind === 'good' ? 'Live' : (kind === 'bad' ? 'Error' : (kind === 'warn' ? 'Idle' : 'Working'));
  badge.className = 'badge ' + (kind === 'warn' ? 'warn' : (kind === 'bad' ? 'bad' : (kind === 'good' ? 'good' : 'info')));
}

function startStream() {
  if (!currentRunId) {
    setStatus('Pick a run from the list first', 'warn');
    return;
  }
  if (evtSource) {
    evtSource.close();
    evtSource = null;
  }
  const speed = document.getElementById('speed').value;
  const window = document.getElementById('window').value;
  const emit_ms = document.getElementById('emit_ms').value;
  const url = `/api/stream/${encodeURIComponent(currentRunId)}?speed=${speed}&window=${window}&emit_ms=${emit_ms}`;
  evtSource = new EventSource(url);
  setStatus('Connecting to ' + url, 'info');

  evtSource.addEventListener('meta', (e) => {
    const meta = JSON.parse(e.data);
    document.getElementById('m_run').textContent = meta.run_id;
    document.getElementById('m_idx').textContent = meta.advance_per_emit;
    document.getElementById('m_speed').textContent = meta.speed + ' x';
    document.getElementById('m_emit').textContent = meta.emit_ms + ' ms';
    document.getElementById('m_window').textContent = meta.window;
    setStatus(`Streaming ${meta.run_id} (advance ${meta.advance_per_emit} samples / ${meta.emit_ms} ms)`, 'good');
  });

  evtSource.addEventListener('chart', (e) => {
    const payload = JSON.parse(e.data);
    latestByField = payload.by_field;
    document.getElementById('m_idx').textContent = payload.next_idx;
    const tNow = performance.now();
    if (lastRenderMs > 0) {
      const dt = tNow - lastRenderMs;
      if (dt > 0) {
        emitTickHistory.push(1000 / dt);
        if (emitTickHistory.length > 30) emitTickHistory.shift();
      }
    }
    lastRenderMs = tNow;
    requestAnimationFrame(render);
  });

  evtSource.addEventListener('eof', (e) => {
    const payload = JSON.parse(e.data);
    setStatus(`Stream EOF (${payload.total_samples} samples total)`, 'warn');
    evtSource.close();
    evtSource = null;
  });

  evtSource.onerror = (e) => {
    setStatus('SSE error / connection lost', 'bad');
  };
}

function render() {
  // Build traces from the latest by_field map.
  const traces = ['BX', 'BY', 'BFreq'].map(f => ({
    x: (latestByField[f] || []).map(p => p.t / 1e9),
    y: (latestByField[f] || []).map(p => p.y),
    mode: 'lines',
    name: FIELD_NAME[f],
    line: { color: COLOR[f], width: 1.5 },
    yaxis: f === 'BFreq' ? 'y2' : 'y',
  }));
  Plotly.react('chart', traces, {}, { responsive: true });

  // FPS readout.
  if (emitTickHistory.length > 0) {
    const avg = emitTickHistory.reduce((a, b) => a + b, 0) / emitTickHistory.length;
    document.getElementById('m_fps').textContent = avg.toFixed(1);
    document.getElementById('fps-readout').textContent = avg.toFixed(1) + ' fps';
  }
}

function stopStream() {
  if (evtSource) {
    evtSource.close();
    evtSource = null;
    setStatus('Stopped', 'warn');
  }
}

// Wire up controls.
document.getElementById('btn-start').onclick = startStream;
document.getElementById('btn-stop').onclick = stopStream;
document.getElementById('speed').oninput = (e) => {
  document.getElementById('spd-val').textContent = e.target.value;
  // Reconnect with the new speed.
  if (evtSource) startStream();
};
document.getElementById('window').oninput = (e) => {
  document.getElementById('win-val').textContent = e.target.value;
  if (evtSource) startStream();
};
document.getElementById('emit_ms').oninput = (e) => {
  document.getElementById('emit-val').textContent = e.target.value;
  const ms = parseInt(e.target.value, 10);
  document.getElementById('emit-hz').textContent = Math.round(1000 / ms);
  if (evtSource) startStream();
};

// Initialize the chart layout (empty) so the page doesn't look broken.
Plotly.newPlot('chart', [], {
  margin: { l: 60, r: 60, t: 20, b: 40 },
  xaxis: { title: 'Time (s since run start)' },
  yaxis: { title: 'B-X / B-Y (V)', side: 'left' },
  yaxis2: { title: 'B-Freq (Hz)', side: 'right', overlaying: 'y' },
  showlegend: true,
  legend: { x: 0, y: 1 },
  paper_bgcolor: '#fff', plot_bgcolor: '#fff',
}, { responsive: true });

loadFileList();
</script>
</body>
</html>
