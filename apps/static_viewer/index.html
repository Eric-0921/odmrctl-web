<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OE1022D Dataset Viewer</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1f2328; font-size: 13px; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
  .topbar h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .badge.good { background: #dafbe1; color: #1a7f37; }
  .badge.info { background: #ddf4ff; color: #0969da; }
  .badge.warn { background: #fff8c5; color: #9a6700; }
  .badge.bad { background: #ffebe9; color: #cf222e; }
  .main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 80px); gap: 1px; background: #d0d7de; }
  .sidebar { background: #fff; padding: 12px; overflow-y: auto; }
  .chart { background: #fff; padding: 12px; }
  .label { display: block; font-size: 11px; color: #656d76; margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .metric { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .metric .v { font-weight: 600; font-family: ui-monospace, monospace; }
  .file-list { max-height: 200px; overflow-y: auto; border: 1px solid #d0d7de; border-radius: 3px; background: #fff; }
  .file-list .item { padding: 4px 8px; font-family: ui-monospace, monospace; font-size: 11px; cursor: pointer; border-bottom: 1px solid #f5f7fa; }
  .file-list .item:hover { background: #f6f8fa; }
  .file-list .item.selected { background: #ddf4ff; color: #0969da; font-weight: 600; }
  .statusbar { padding: 6px 16px; background: #fff; border-top: 1px solid #d0d7de; font-size: 11px; color: #656d76; }
  .playbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .playbar button { padding: 4px 10px; border: 1px solid #d0d7de; background: #fff; border-radius: 3px; cursor: pointer; font-size: 12px; }
  .playbar button:hover { background: #f6f8fa; }
  .playbar button.primary { background: #0969da; color: #fff; border-color: #0969da; }
  .playbar input[type=range] { flex: 1; }
  .playbar .spd { font-family: ui-monospace, monospace; font-size: 11px; color: #656d76; min-width: 60px; }
</style>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="topbar">
  <h1>OE1022D Dataset Viewer</h1>
  <span class="badge info" id="status-badge">Idle</span>
  <span id="file-path" style="color: #656d76; font-family: ui-monospace, monospace; font-size: 12px;"></span>
</div>
<div class="main">
  <div class="sidebar">
    <span class="label">Run files (./runs/*/samples.ndjson)</span>
    <div class="file-list" id="file-list">
      <div class="item" style="color: #656d76; cursor: default;">loading...</div>
    </div>
    <span class="label">Status</span>
    <div class="metric"><span>Loaded</span><span class="v" id="m-loaded">—</span></div>
    <div class="metric"><span>Frames</span><span class="v" id="m-frames">—</span></div>
    <div class="metric"><span>Samples</span><span class="v" id="m-samples">—</span></div>
    <div class="metric"><span>Span (s)</span><span class="v" id="m-span">—</span></div>
    <div class="metric"><span>File size</span><span class="v" id="m-size">—</span></div>
    <span class="label">Playback</span>
    <div class="playbar">
      <button class="primary" id="btn-play">▶ Play</button>
      <button id="btn-pause">⏸ Pause</button>
      <button id="btn-reset">⏮ Reset</button>
      <input type="range" id="speed" min="0.5" max="200" step="0.5" value="50" />
      <span class="spd"><span id="spd-val">50</span>x</span>
    </div>
    <div class="playbar">
      <span class="spd" style="min-width: auto;">Visible window:</span>
      <input type="range" id="window" min="100" max="5000" step="100" value="1000" />
      <span class="spd" id="win-val">1000</span>
    </div>
  </div>
  <div class="chart" id="chart"></div>
</div>
<div class="statusbar" id="statusbar">Ready</div>

<script>
const COLOR = {
  BX: '#0969da',
  BY: '#1a7f37',
  BFreq: '#9a6700',
};
const FIELD_NAME = { BX: 'B-X (V)', BY: 'B-Y (V)', BFreq: 'B-Freq (Hz)' };

let allSamples = [];
let currentFile = null;
let playing = false;
let playSpeed = 50; // samples per real-time second
let visibleWindow = 1000;
let playIndex = 0;
let lastFrameTs = 0;

async function loadFileList() {
  const list = document.getElementById('file-list');
  try {
    const r = await fetch('/api/runs');
    const runs = await r.json();
    list.innerHTML = '';
    if (runs.length === 0) {
      list.innerHTML = '<div class="item" style="color: #656d76; cursor: default;">no runs found</div>';
      return;
    }
    for (const r of runs) {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = `${r.run_id}  (${r.size_mb.toFixed(1)} MB)`;
      item.onclick = () => loadRun(r.run_id);
      list.appendChild(item);
    }
  } catch (e) {
    list.innerHTML = `<div class="item" style="color: #cf222e; cursor: default;">error: ${e}</div>`;
  }
}

async function loadRun(runId) {
  setStatus('Loading ' + runId + '...', 'info');
  const r = await fetch('/api/runs/' + runId + '/samples.ndjson');
  if (!r.ok) {
    setStatus('Load failed: HTTP ' + r.status, 'bad');
    return;
  }
  const text = await r.text();
  allSamples = [];
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    try {
      const s = JSON.parse(line);
      allSamples.push(s);
    } catch (e) { /* skip malformed */ }
  }
  // Mark selected in file list.
  document.querySelectorAll('.file-list .item').forEach(el => {
    el.classList.toggle('selected', el.textContent.startsWith(runId));
  });
  currentFile = runId;
  document.getElementById('file-path').textContent = '/runs/' + runId + '/samples.ndjson';

  const frames = new Set(allSamples.map(s => s.frame_sequence_no)).size;
  const span = allSamples.length > 0
    ? ((allSamples[allSamples.length - 1].t_mono_ns - allSamples[0].t_mono_ns) / 1e9).toFixed(1)
    : 0;
  document.getElementById('m-loaded').textContent = runId;
  document.getElementById('m-frames').textContent = frames;
  document.getElementById('m-samples').textContent = allSamples.length;
  document.getElementById('m-span').textContent = span;
  document.getElementById('m-size').textContent = (text.length / 1024 / 1024).toFixed(2) + ' MB';

  // Initialize chart layout.
  const traces = ['BX', 'BY', 'BFreq'].map(f => ({
    x: [],
    y: [],
    mode: 'lines',
    name: FIELD_NAME[f],
    line: { color: COLOR[f], width: 1.5 },
    yaxis: f === 'BFreq' ? 'y2' : 'y',
  }));
  const layout = {
    margin: { l: 60, r: 60, t: 20, b: 40 },
    xaxis: { title: 'Time (s since run start)', type: 'linear' },
    yaxis: { title: 'B-X / B-Y (V)', side: 'left' },
    yaxis2: { title: 'B-Freq (Hz)', side: 'right', overlaying: 'y', side: 'right' },
    showlegend: true,
    legend: { x: 0, y: 1 },
    paper_bgcolor: '#fff',
    plot_bgcolor: '#fff',
  };
  Plotly.newPlot('chart', traces, layout, { responsive: true, displayModeBar: true });
  playIndex = 0;
  setStatus(`Loaded ${allSamples.length} samples in ${frames} frames (${span}s span)`, 'good');
  // Auto-play.
  play();
}

function setStatus(msg, kind = 'info') {
  document.getElementById('statusbar').textContent = msg;
  const badge = document.getElementById('status-badge');
  badge.textContent = kind === 'good' ? 'Ready' : (kind === 'bad' ? 'Error' : 'Working');
  badge.className = 'badge ' + (kind === 'warn' ? 'warn' : (kind === 'bad' ? 'bad' : (kind === 'good' ? 'good' : 'info')));
}

function visibleSamples() {
  if (allSamples.length === 0) return [];
  const start = Math.max(0, allSamples.length - visibleWindow);
  return allSamples.slice(start);
}

function redraw() {
  if (allSamples.length === 0) return;
  const t0 = allSamples[0].t_mono_ns;
  const visible = visibleSamples();
  const byField = { BX: { x: [], y: [] }, BY: { x: [], y: [] }, BFreq: { x: [], y: [] } };
  for (const s of visible) {
    byField[s.field].x.push((s.t_mono_ns - t0) / 1e9);
    byField[s.field].y.push(s.value);
  }
  const traces = ['BX', 'BY', 'BFreq'].map(f => ({
    x: byField[f].x,
    y: byField[f].y,
    mode: 'lines',
    name: FIELD_NAME[f],
    line: { color: COLOR[f], width: 1.5 },
    yaxis: f === 'BFreq' ? 'y2' : 'y',
  }));
  Plotly.react('chart', traces, {}, { responsive: true });
}

function play() { playing = true; lastFrameTs = performance.now(); requestAnimationFrame(playTick); document.getElementById('btn-play').textContent = '▶ Playing'; }
function pause() { playing = false; document.getElementById('btn-play').textContent = '▶ Play'; }
function reset() { playIndex = 0; redraw(); }

function playTick() {
  if (!playing) return;
  const now = performance.now();
  const dt = (now - lastFrameTs) / 1000; // seconds
  lastFrameTs = now;
  // We advance playIndex by N samples per real-time second,
  // mapped to playback: playSpeed samples per real second at 1x.
  const advance = Math.max(1, Math.floor(playSpeed * dt));
  playIndex = Math.min(allSamples.length, playIndex + advance);
  // If we've reached the end, stop and rewind.
  if (playIndex >= allSamples.length) {
    pause();
    return;
  }
  // Visible window: show the last `visibleWindow` samples up to playIndex.
  const t0 = allSamples[0].t_mono_ns;
  const byField = { BX: { x: [], y: [] }, BY: { x: [], y: [] }, BFreq: { x: [], y: [] } };
  const start = Math.max(0, playIndex - visibleWindow);
  for (let i = start; i < playIndex; i++) {
    const s = allSamples[i];
    byField[s.field].x.push((s.t_mono_ns - t0) / 1e9);
    byField[s.field].y.push(s.value);
  }
  const traces = ['BX', 'BY', 'BFreq'].map(f => ({
    x: byField[f].x,
    y: byField[f].y,
    mode: 'lines',
    name: FIELD_NAME[f],
    line: { color: COLOR[f], width: 1.5 },
    yaxis: f === 'BFreq' ? 'y2' : 'y',
  }));
  Plotly.react('chart', traces, {}, { responsive: true });
  requestAnimationFrame(playTick);
}

// Wire up controls.
document.getElementById('btn-play').onclick = play;
document.getElementById('btn-pause').onclick = pause;
document.getElementById('btn-reset').onclick = reset;
document.getElementById('speed').oninput = (e) => {
  playSpeed = parseFloat(e.target.value);
  document.getElementById('spd-val').textContent = playSpeed;
};
document.getElementById('window').oninput = (e) => {
  visibleWindow = parseInt(e.target.value, 10);
  document.getElementById('win-val').textContent = visibleWindow;
  if (!playing) redraw();
};

loadFileList();
</script>
</body>
</html>
