[workspace]

[package]
name = "odmr-gui-m0"
version = "0.1.0"
description = "ODMR Device Workbench M5C-A"
authors = ["ODMR Automation Project"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9"
chrono = "0.4"

# M5C-A: Device Workbench V1 — typed hardware access via preflight and drivers.
# All device interaction goes through Tauri commands; frontend never sends raw SCPI.
odmr-types = { path = "../../../crates/odmr-types" }
odmr-config = { path = "../../../crates/odmr-config" }
odmr-executor = { path = "../../../crates/odmr-executor" }
odmr-replay = { path = "../../../crates/odmr-replay" }
odmr-preflight = { path = "../../../crates/odmr-preflight" }
odmr-laser = { path = "../../../crates/odmr-laser" }
odmr-smb100a = { path = "../../../crates/odmr-smb100a" }
odmr-oe1022d = { path = "../../../crates/odmr-oe1022d" }
odmr-maynuo-m8812 = { path = "../../../crates/odmr-maynuo-m8812" }
